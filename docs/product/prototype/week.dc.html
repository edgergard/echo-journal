<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo — Week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2A4A7F}a:hover{color:#1F3A66}
a:focus-visible,button:focus-visible{outline:2px solid #2A4A7F;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1100px; background: #F5F1E8; color: #1F2430; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
  <header style="border-bottom: 1px solid #D9D1C1;">
    <div style="max-width: 1040px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px;">
      <a href="Main.dc.html" style="font-family: 'Literata', Georgia, serif; font-size: 26px; font-weight: 600; color: #1F2430; text-decoration: none;">Echo</a>
      <nav aria-label="Main" style="display: flex; gap: 4px; flex-grow: 1;">
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 6px; color: #5A5D6B; text-decoration: none;">Journal</a>
        <a href="a-week.dc.html" aria-current="page" style="padding: 10px 14px; border-radius: 6px; background: #E9E3D6; color: #1F2430; text-decoration: none; font-weight: 500;">Week</a>
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 6px; color: #5A5D6B; text-decoration: none;">Settings</a>
      </nav>
      <a href="a-entry.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 6px; background: #2A4A7F; color: #FBF8F2; text-decoration: none; font-weight: 500;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        New entry
      </a>
    </div>
  </header>
  <main style="max-width: 860px; margin: 0 auto; padding: 56px 24px 72px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 32px;">
      <div style="flex: 1 1 260px;">
        <h1 style="margin: 0 0 6px; font-family: 'Literata', Georgia, serif; font-size: 40px; font-weight: 500; letter-spacing: -0.01em;">This week</h1>
        <p style="margin: 0; color: #5A5D6B;">{{range}}</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px;">
        <button type="button" style="padding: 10px 12px; border-radius: 6px; border: 0; background: transparent; color: #2A4A7F; font: inherit; font-weight: 500; cursor: pointer;">← Previous week</button>
        <button type="button" disabled="disabled" aria-disabled="true" style="padding: 10px 12px; border-radius: 6px; border: 0; background: transparent; color: #5A5D6B; opacity: 0.6; font: inherit; font-weight: 500; cursor: not-allowed;">Next week →</button>
      </div>
    </div>

    <section aria-labelledby="mood-heading" style="padding: 24px 28px; background: #FBF8F2; border: 1px solid #D9D1C1; border-radius: 6px;">
      <h2 id="mood-heading" style="margin: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5D6B;">Mood</h2>
      <svg viewBox="0 0 640 240" width="100%" role="img" aria-label="Mood this week: Mon okay, Tue good, Thu low, Fri okay, Sat good" style="display: block; max-width: 100%; height: auto; font-family: 'Geist', system-ui, sans-serif;">
        <g stroke="#D9D1C1" stroke-width="1">
          <line x1="80" y1="30" x2="610" y2="30"></line>
          <line x1="80" y1="70" x2="610" y2="70"></line>
          <line x1="80" y1="110" x2="610" y2="110"></line>
          <line x1="80" y1="150" x2="610" y2="150"></line>
          <line x1="80" y1="190" x2="610" y2="190"></line>
        </g>
        <g fill="#5A5D6B" font-size="13" text-anchor="end">
          <text x="68" y="34">great</text>
          <text x="68" y="74">good</text>
          <text x="68" y="114">okay</text>
          <text x="68" y="154">low</text>
          <text x="68" y="194">rough</text>
        </g>
        <g fill="#5A5D6B" font-size="13" text-anchor="middle">
          <text x="110" y="224">Mon</text>
          <text x="190" y="224">Tue</text>
          <text x="270" y="224">Wed</text>
          <text x="350" y="224">Thu</text>
          <text x="430" y="224">Fri</text>
          <text x="510" y="224">Sat</text>
          <text x="590" y="224">Sun</text>
        </g>
        <g fill="none" stroke="#2A4A7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="110,110 190,70"></polyline>
          <polyline points="350,150 430,110 510,70"></polyline>
        </g>
        <g fill="#2A4A7F" stroke="#FBF8F2" stroke-width="2">
          <circle cx="110" cy="110" r="6"></circle>
          <circle cx="190" cy="70" r="6"></circle>
          <circle cx="350" cy="150" r="6"></circle>
          <circle cx="430" cy="110" r="6"></circle>
          <circle cx="510" cy="70" r="6"></circle>
        </g>
      </svg>
      <div style="margin-top: 12px;">
        <button type="button" style="padding: 8px 0; border: 0; background: transparent; color: #2A4A7F; font: inherit; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Show as table</button>
      </div>
    </section>

    <section aria-labelledby="themes-heading" style="margin-top: 48px;">
      <h2 id="themes-heading" style="margin: 0 0 16px; font-family: 'Literata', Georgia, serif; font-size: 26px; font-weight: 500;">Themes</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 16px;">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
          <li style="flex: 1 1 240px; padding: 22px 24px; background: #FBF8F2; border: 1px solid #D9D1C1; border-radius: 6px;">
            <h3 style="margin: 0 0 8px; font-family: 'Literata', Georgia, serif; font-size: 20px; font-weight: 500;">{{t.title}}</h3>
            <p style="margin: 0 0 14px; color: #1F2430;">{{t.text}}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 16px;">
              <sc-for list="{{t.links}}" as="l" hint-placeholder-count="2">
                <a href="a-entry.dc.html" style="display: inline-block; padding: 4px 0; font-size: 14px; font-weight: 500;">{{l.label}}</a>
              </sc-for>
            </div>
          </li>
        </sc-for>
      </ul>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 24px;">
        <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 6px; border: 1px solid #D9D1C1; background: #E9E3D6; color: #1F2430; font: inherit; font-weight: 500; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
          Refresh summary
        </button>
        <p style="margin: 0; color: #5A5D6B; font-size: 14px;">Summaries use one of today’s 10 replies.</p>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      range: 'Nov 16 – 22',
      themes: [
        { title: 'The move', text: 'Four of five entries mention the new flat: tired early in the week, relieved by Friday.', links: [ { label: 'Thu, Nov 19' }, { label: 'Fri, Nov 20' } ] },
        { title: 'Family', text: 'Your dad and your grandmother’s letters came up twice.', links: [ { label: 'Sun, Nov 15' }, { label: 'Thu, Nov 19' } ] },
        { title: 'Reconnecting', text: 'Calling Marta and the river walk were the brightest moments.', links: [ { label: 'Tue, Nov 17' } ] }
      ]
    };
  }
}
</script>
</body>
</html>
