<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo — Entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8}
a{color:#2A4A7F}a:hover{color:#1F3A66}
a:focus-visible,button:focus-visible{outline:2px solid #2A4A7F;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1100px; background: #F5F1E8; color: #1F2430; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; line-height: 1.5;">
  <header style="border-bottom: 1px solid #D9D1C1;">
    <div style="max-width: 1040px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px;">
      <a href="Main.dc.html" style="font-family: 'Literata', Georgia, serif; font-size: 26px; font-weight: 600; color: #1F2430; text-decoration: none;">Echo</a>
      <nav aria-label="Main" style="display: flex; gap: 4px; flex-grow: 1;">
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 6px; background: #E9E3D6; color: #1F2430; text-decoration: none; font-weight: 500;">Journal</a>
        <a href="a-week.dc.html" style="padding: 10px 14px; border-radius: 6px; color: #5A5D6B; text-decoration: none;">Week</a>
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 6px; color: #5A5D6B; text-decoration: none;">Settings</a>
      </nav>
      <a href="a-entry.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 6px; background: #2A4A7F; color: #FBF8F2; text-decoration: none; font-weight: 500;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        New entry
      </a>
    </div>
  </header>
  <main style="max-width: 1040px; margin: 0 auto; padding: 40px 24px 72px;">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; color: #5A5D6B; text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      Journal
    </a>
    <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
      <div style="flex: 999 1 560px; min-width: 0; max-width: 720px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 24px;">
          <h1 style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.01em;">{{entry.date}}</h1>
          <span style="padding: 3px 12px; border-radius: 999px; background: #ECE6DA; color: #1F2430; font-size: 13px;">{{entry.mood}}</span>
          <button type="button" aria-label="Entry actions" aria-haspopup="menu" style="margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 6px; border: 1px solid #D9D1C1; background: transparent; color: #1F2430; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
          </button>
        </div>
        <article style="padding: 28px 32px; background: #FBF8F2; border: 1px solid #D9D1C1; border-radius: 6px;">
          <p style="margin: 0; max-width: 68ch; font-family: 'Literata', Georgia, serif; font-size: 18px; line-height: 1.7; color: #1F2430;">{{entry.text}}</p>
        </article>
      </div>
    </div>
    <section aria-labelledby="echo-heading" style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">
      <div style="flex: 999 1 560px; min-width: 0; max-width: 720px;">
        <h2 id="echo-heading" style="margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5D6B;">Echo</h2>
        <div style="padding: 28px 32px; background: #FBF8F2; border: 1px solid #D9D1C1; border-radius: 6px;">
          <p style="margin: 0; max-width: 68ch; font-family: 'Literata', Georgia, serif; font-size: 18px; line-height: 1.7; color: #1F2430;">{{reply}}</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 20px;">
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 6px; border: 1px solid #D9D1C1; background: #E9E3D6; color: #1F2430; font: inherit; font-weight: 500; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
            Regenerate reply
          </button>
          <p style="margin: 0; color: #5A5D6B; font-size: 14px;">Echo is not a therapist.</p>
        </div>
      </div>
      <aside aria-label="Recalled entries" style="flex: 1 1 240px; max-width: 300px; display: flex; flex-direction: column; gap: 28px; padding-top: 34px;">
        <sc-for list="{{recalled}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; gap: 12px; align-items: flex-start;">
            <div aria-hidden="true" style="flex: 0 0 24px; height: 0; margin-top: 10px; border-top: 1px solid #2A4A7F;"></div>
            <div style="flex: 1 1 auto; min-width: 0;">
              <p style="margin: 0 0 6px; font-size: 13px; color: #5A5D6B;">Recalled from {{r.date}}</p>
              <p style="margin: 0 0 8px; font-family: 'Literata', Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.55; color: #1F2430;">“{{r.quote}}”</p>
              <a href="Main.dc.html" style="display: inline-block; padding: 4px 0; font-size: 14px; font-weight: 500;">Open entry</a>
            </div>
          </div>
        </sc-for>
      </aside>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      entry: {
        date: 'Friday, November 20',
        mood: 'okay',
        text: 'Finally finished the move. The new flat is quiet in a way I’m not used to yet; I keep listening for the neighbours’ radio. Unpacked the kitchen first, the way Mum always did. Tomorrow: curtains, and maybe calling Dad.'
      },
      reply: 'A quiet flat after a loud month is worth noticing. Last Sunday you wrote about arguing with your dad over this move — have you two talked since? And the letters you found on Thursday: it sounds like this move is carrying more than boxes. What would make the new place feel like yours this week?',
      recalled: [
        { date: 'Nov 15', quote: 'I said things I didn’t mean.' },
        { date: 'Nov 19', quote: 'found the letters from my grandmother' }
      ]
    };
  }
}
</script>
</body>
</html>
